name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Per-step "shell:" cannot hold an expression, and defaults.run does accept
    # matrix, so the OS choice goes here and covers every run step at once.
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (glibc, static)
            os: ubuntu-latest
            ldflags: '-static -Wl,--gc-sections'
            artifact: ffmpeg-linux-x86_64
            binary: ./ffmpeg
          - name: Windows (mingw-w64)
            os: windows-latest
            ldflags: '-Wl,--gc-sections'
            artifact: ffmpeg-windows-x86_64.exe
            binary: ./ffmpeg.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm make gcc libc6-dev

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # base-devel gives the msys make and diffutils that ffmpeg's configure
          # needs. The mingw toolchain group gives gcc/binutils in /mingw64/bin.
          install: base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-nasm

      - name: Build
        env:
          EXTRA_LDFLAGS: ${{ matrix.ldflags }}
        run: ./build.sh

      - name: Verify
        env:
          BINARY: ${{ matrix.binary }}
        run: "$BINARY -hide_banner -version"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Release ${{ github.ref_name }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/* || gh release upload "${{ github.ref_name }}" dist/* --clobber
