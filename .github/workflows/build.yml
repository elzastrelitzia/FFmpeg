name: Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Per-step "shell:" cannot hold an expression, and defaults.run does accept
    # matrix, so the OS choice goes here and covers every run step at once.
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (glibc, static)
            os: ubuntu-latest
            artifact: ffmpeg-linux-x86_64
            binary: ./ffmpeg
          - name: Windows (mingw-w64)
            os: windows-latest
            artifact: ffmpeg-windows-x86_64.exe
            binary: ./ffmpeg.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm make gcc libc6-dev

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # base-devel gives the msys make and diffutils that ffmpeg's configure
          # needs. The mingw toolchain group gives gcc/binutils in /mingw64/bin.
          install: base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-nasm

      # The Windows script owns the flags and the import check, so the flag that
      # broke Windows cannot be set from the matrix again. Linux uses build.sh,
      # which already defaults to -static.
      - name: Build
        run: ${{ runner.os == 'Windows' && './build-windows.sh' || './build.sh' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # Runs on every manual dispatch, not on a tag. The tag is generated from the
  # run number, so there is no tag trigger in `on:` and the release cannot
  # re-trigger this workflow.
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create shells out to git, so it needs a repository.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Without this each artifact lands in its own subdirectory and
          # "dist/*" expands to directories, not files.
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release create "$TAG" \
            --target "$SHA" \
            --title "build ${{ github.run_number }} (${SHA:0:7})" \
            --notes "Commit ${SHA}. Run $RUN." \
            dist/* || gh release upload "$TAG" dist/* --clobber
